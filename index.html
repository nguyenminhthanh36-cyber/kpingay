function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
function eq(a,b){if(a.length!==b.length)return false;var d=0;for(var i=0;i<a.length;i++)d|=a[i]^b[i];return d===0;}
async function dec(pw){
  var c=crypto.subtle,salt=b64(D.salt),iv=b64(D.iv),ct=b64(D.ct),tag=b64(D.hmac);
  var base=await c.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  var bits=new Uint8Array(await c.deriveBits({name:"PBKDF2",salt:salt,iterations:D.iter,hash:"SHA-256"},base,512));
  var ek=await c.importKey("raw",bits.slice(0,32),{name:"AES-CBC"},false,["decrypt"]);
  var mk=await c.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  var m=new Uint8Array(iv.length+ct.length);m.set(iv);m.set(ct,iv.length);
  var t=new Uint8Array(await c.sign("HMAC",mk,m));
  if(!eq(t,tag))return null;
  return new Uint8Array(await c.decrypt({name:"AES-CBC",iv:iv},ek,ct));
}
var f=document.getElementById("f"),pw=document.getElementById("pw"),btn=document.getElementById("btn"),msg=document.getElementById("msg");
if(!window.crypto||!crypto.subtle){msg.textContent="Trình duyệt không hỗ trợ giải mã";}
f.addEventListener("submit",async function(e){
  e.preventDefault();msg.textContent="";btn.disabled=true;
  try{
    var out=await dec(pw.value);
    if(!out){msg.textContent="Sai mật khẩu";btn.disabled=false;pw.focus();return;}
    var html=new TextDecoder("utf-8").decode(out);
    document.open();document.write(html);document.close();
  }catch(err){msg.textContent="Sai mật khẩu";btn.disabled=false;}
});
})();
